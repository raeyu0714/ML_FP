<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#374151"/></marker><style>text{font-family:Arial,'Noto Sans CJK TC',sans-serif;fill:#111827}.title{font-size:30px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:18px}.tiny{font-size:16px}.box{stroke:#334155;stroke-width:2;rx:14}.stage{fill:#eff6ff}.feat{fill:#ecfdf5}.head{fill:#fff7ed}.out{fill:#f5f3ff}.arrow{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="720" fill="white"/>
<text x="50" y="55" class="title">XFeat baseline：共享 CNN、三個尺度與稀疏配對</text>
<text x="50" y="88" class="small">依研究簡報整理：x3 / x4 / x5 特徵、skip fusion、64D descriptor、keypoint/reliability 與 MNN</text>
<rect x="50" y="145" width="180" height="95" class="box stage"/><text x="140" y="185" text-anchor="middle" class="label">Image A</text><text x="140" y="215" text-anchor="middle" class="small">RGB image</text>
<rect x="50" y="390" width="180" height="95" class="box stage"/><text x="140" y="430" text-anchor="middle" class="label">Image B</text><text x="140" y="460" text-anchor="middle" class="small">RGB image</text>
<rect x="300" y="125" width="250" height="390" class="box stage"/><text x="425" y="170" text-anchor="middle" class="label">Shared XFeat CNN</text><text x="425" y="205" text-anchor="middle" class="small">same weights for A / B</text><rect x="335" y="245" width="180" height="55" class="box feat"/><text x="425" y="280" text-anchor="middle" class="label">x3 · 1/8</text><rect x="335" y="330" width="180" height="55" class="box feat"/><text x="425" y="365" text-anchor="middle" class="label">x4 · 1/16</text><rect x="335" y="415" width="180" height="55" class="box feat"/><text x="425" y="450" text-anchor="middle" class="label">x5 · 1/32</text>
<path d="M230 192 L300 192" class="arrow"/><path d="M230 437 L300 437" class="arrow"/>
<rect x="630" y="125" width="250" height="155" class="box feat"/><text x="755" y="168" text-anchor="middle" class="label">Multi-scale fusion</text><text x="755" y="205" text-anchor="middle" class="small">s = x3 + up(x4)</text><text x="755" y="238" text-anchor="middle" class="small">deep feature d = x5</text>
<path d="M550 280 L630 200" class="arrow"/><path d="M550 365 L630 215" class="arrow"/><path d="M550 450 L630 245" class="arrow"/>
<rect x="630" y="350" width="250" height="165" class="box head"/><text x="755" y="395" text-anchor="middle" class="label">Keypoint / descriptor</text><text x="755" y="432" text-anchor="middle" class="small">reliability + keypoint heatmap</text><text x="755" y="468" text-anchor="middle" class="small">64D descriptor per point</text><path d="M755 280 L755 350" class="arrow"/>
<rect x="970" y="145" width="220" height="100" class="box head"/><text x="1080" y="185" text-anchor="middle" class="label">Candidate points</text><text x="1080" y="218" text-anchor="middle" class="small">sparse, top-K</text><path d="M880 430 L970 200" class="arrow"/>
<rect x="970" y="330" width="220" height="100" class="box out"/><text x="1080" y="370" text-anchor="middle" class="label">Descriptor match</text><text x="1080" y="403" text-anchor="middle" class="small">cosine + mutual NN</text><path d="M1190 195 L1280 195" class="arrow"/><path d="M1190 380 L1280 380" class="arrow"/>
<rect x="1280" y="145" width="170" height="100" class="box out"/><text x="1365" y="185" text-anchor="middle" class="label">Matched</text><text x="1365" y="218" text-anchor="middle" class="small">sparse pairs</text>
<rect x="1280" y="330" width="170" height="100" class="box out"/><text x="1365" y="370" text-anchor="middle" class="label">Pose / 3D</text><text x="1365" y="403" text-anchor="middle" class="small">geometry solver</text><path d="M1365 245 L1365 330" class="arrow"/>
<text x="970" y="565" class="tiny">瓶頸：真實位置若未進入 candidate set，後端只能在候選內選擇。</text><text x="970" y="592" class="tiny">研究方向：保留 backbone 效率，加入全局搜尋與連續座標細化。</text>
</svg>
