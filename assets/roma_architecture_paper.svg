<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#374151"/></marker><style>text{font-family:Arial,'Noto Sans CJK TC',sans-serif;fill:#111827}.title{font-size:30px;font-weight:700}.label{font-size:21px;font-weight:700}.small{font-size:17px}.box{stroke:#64748b;stroke-width:2;rx:14}.coarse{fill:#fff7d6}.fine{fill:#e0f2fe}.decode{fill:#dcfce7}.loss{fill:#f1f5f9}.arrow{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="760" fill="white"/>
<text x="50" y="55" class="title">RoMa baseline：全局 coarse matching → warp refinement</text>
<text x="50" y="88" class="small">以論文 Figure 2 重畫：粗特徵、細特徵、Transformer match decoder 與分開的 coarse / fine supervision</text>
<rect x="50" y="145" width="120" height="75" class="box coarse"/><text x="110" y="177" text-anchor="middle" class="label">Image A</text><text x="110" y="202" text-anchor="middle" class="small">Iᴬ</text>
<rect x="50" y="285" width="120" height="75" class="box coarse"/><text x="110" y="317" text-anchor="middle" class="label">Image B</text><text x="110" y="342" text-anchor="middle" class="small">Iᴮ</text>
<rect x="230" y="120" width="300" height="190" class="box coarse"/><text x="380" y="160" text-anchor="middle" class="label">Coarse feature encoder</text><text x="380" y="200" text-anchor="middle" class="small">frozen foundation features</text><text x="380" y="232" text-anchor="middle" class="small">global grid / anchor tokens</text><text x="380" y="272" text-anchor="middle" class="small">wide-area search</text>
<path d="M170 182 L230 182" class="arrow"/><path d="M170 322 L230 250" class="arrow"/>
<rect x="230" y="390" width="300" height="190" class="box fine"/><text x="380" y="430" text-anchor="middle" class="label">Fine feature encoder</text><text x="380" y="470" text-anchor="middle" class="small">specialized ConvNet</text><text x="380" y="502" text-anchor="middle" class="small">localizable fine features</text><text x="380" y="542" text-anchor="middle" class="small">used around coarse warp</text><path d="M170 322 L230 465" class="arrow"/>
<rect x="650" y="145" width="260" height="130" class="box decode"/><text x="780" y="185" text-anchor="middle" class="label">Transformer match decoder</text><text x="780" y="220" text-anchor="middle" class="small">predict anchor probabilities</text><text x="780" y="250" text-anchor="middle" class="small">rather than one hard coordinate</text><path d="M530 210 L650 210" class="arrow"/>
<rect x="650" y="390" width="260" height="130" class="box decode"/><text x="780" y="430" text-anchor="middle" class="label">Warp refiner</text><text x="780" y="465" text-anchor="middle" class="small">local coordinate refinement</text><text x="780" y="495" text-anchor="middle" class="small">coarse → fine</text><path d="M530 485 L650 460" class="arrow"/><path d="M780 275 L780 390" class="arrow"/>
<rect x="1030" y="125" width="260" height="150" class="box loss"/><text x="1160" y="165" text-anchor="middle" class="label">Coarse output</text><text x="1160" y="202" text-anchor="middle" class="small">global match distribution</text><text x="1160" y="235" text-anchor="middle" class="small">regression-by-classification</text><text x="1160" y="262" text-anchor="middle" class="small">L_coarse</text><path d="M910 210 L1030 210" class="arrow"/>
<rect x="1030" y="390" width="260" height="150" class="box loss"/><text x="1160" y="430" text-anchor="middle" class="label">Fine output</text><text x="1160" y="467" text-anchor="middle" class="small">continuous correspondence</text><text x="1160" y="500" text-anchor="middle" class="small">robust regression</text><text x="1160" y="527" text-anchor="middle" class="small">L_fine</text><path d="M910 455 L1030 455" class="arrow"/>
<rect x="1340" y="235" width="190" height="140" class="box decode"/><text x="1435" y="275" text-anchor="middle" class="label">Dense matches</text><text x="1435" y="312" text-anchor="middle" class="small">warp + confidence</text><text x="1435" y="345" text-anchor="middle" class="small">pose / geometry</text><path d="M1290 210 L1340 275" class="arrow"/><path d="M1290 455 L1340 345" class="arrow"/>
</svg>
